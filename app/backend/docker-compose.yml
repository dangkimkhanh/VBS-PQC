services:
  mongodb:
    image: mongo:6.0
    container_name: vbcc_mongodb
    restart: unless-stopped
    ports:
      # Localhost only: Docker-published ports bypass ufw.
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db

  minio:
    # minio/minio is no longer published on Docker Hub; Chainguard ships patched builds.
    image: cgr.dev/chainguard/minio:latest
    container_name: vbcc_minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  mongo-data:
  minio-data: